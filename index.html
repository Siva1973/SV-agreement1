<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subject-Verb Agreement Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      color: #333;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .question-number {
      font-size: 1.4em;
      margin: 15px 0;
    }

    .question {
      font-size: 1.8em;
      margin: 20px 0;
    }

    .answer-option {
      font-size: 1.3em;
      padding: 12px 20px;
      margin: 10px;
      background-color: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
    }

    .answer-option:hover {
      background-color: #f1f1f1;
    }

    .next-button {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 1.2em;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .next-button:hover {
      background-color: #218838;
    }

    .score {
      font-size: 1.5em;
      margin-top: 15px;
    }

    .gif-container {
      margin-top: 15px;
    }

    .gif-image {
      width: 220px;
      height: auto;
      border-radius: 10px;
    }

    .explanation {
      margin-top: 15px;
      font-style: italic;
      font-size: 1.1em;
    }

    .toggle-container {
      margin-top: 30px;
    }

    .toggle-label {
      font-size: 1.2em;
      margin-right: 10px;
    }

    .music-toggle {
      width: 60px;
      height: 30px;
    }
  </style>
</head>
<body>

  <h1>Subject-Verb Agreement Game</h1>

  <div class="question-number" id="question-number">Question 1 of 10</div>
  <div class="question" id="question">Loading...</div>
  <div id="answers"></div>

  <div>
    <button class="next-button" onclick="nextQuestion()">Next</button>
  </div>

  <div class="score" id="score">Score: 0</div>
  <div class="explanation" id="explanation"></div>

  <div class="gif-container">
    <img id="gif" class="gif-image" src="" alt="Feedback Image">
  </div>

  <div class="toggle-container">
    <label class="toggle-label" for="music-toggle">🎵 Background Music:</label>
    <input type="checkbox" id="music-toggle" class="music-toggle" onchange="toggleMusic()">
  </div>

  <!-- Background and Feedback Audio -->
  <audio id="bg-music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-clearday.mp3" type="audio/mp3" />
  </audio>

  <audio id="correct-music">
    <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mp3" />
  </audio>

  <audio id="wrong-music">
    <source src="https://www.soundjay.com/buttons/sounds/button-10.mp3" type="audio/mp3" />
  </audio>

  <script>
    const questions = [
      {
        question: "She ____ a teacher.",
        options: ["is", "are", "am"],
        correctAnswer: "is",
        explanation: "'She' is singular, so it takes 'is'.",
      },
      {
        question: "They ____ playing football.",
        options: ["is", "are", "am"],
        correctAnswer: "are",
        explanation: "'They' is plural, so it takes 'are'.",
      },
      {
        question: "I ____ going to the store.",
        options: ["is", "are", "am"],
        correctAnswer: "am",
        explanation: "'I' always takes 'am'.",
      },
      {
        question: "The books ____ on the table.",
        options: ["is", "are", "am"],
        correctAnswer: "are",
        explanation: "'Books' is plural, so 'are' is correct.",
      },
      {
        question: "My mother ____ a great cook.",
        options: ["is", "are", "am"],
        correctAnswer: "is",
        explanation: "'Mother' is singular, so use 'is'.",
      },
      {
        question: "The team ____ practicing hard.",
        options: ["is", "are", "am"],
        correctAnswer: "is",
        explanation: "'Team' is a singular collective noun.",
      },
      {
        question: "John and Sarah ____ friends.",
        options: ["is", "are", "am"],
        correctAnswer: "are",
        explanation: "Two people = plural → 'are'.",
      },
      {
        question: "The cat ____ sleeping peacefully.",
        options: ["is", "are", "am"],
        correctAnswer: "is",
        explanation: "'Cat' is singular.",
      },
      {
        question: "We ____ excited for the trip.",
        options: ["is", "are", "am"],
        correctAnswer: "are",
        explanation: "'We' is plural, so use 'are'.",
      },
      {
        question: "He ____ reading a book.",
        options: ["is", "are", "am"],
        correctAnswer: "is",
        explanation: "'He' is singular, so it takes 'is'.",
      }
    ];

    const correctGif = "https://media.giphy.com/media/26n6WywJyh39n1pBu/giphy.gif"; // Boy raising hand
    const wrongGif = "https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif"; // Cat running

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question-number").textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      document.getElementById("question").textContent = q.question;

      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "answer-option";
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option);
        answersDiv.appendChild(btn);
      });

      document.getElementById("explanation").textContent = "";
      document.getElementById("gif").src = "";
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      const gif = document.getElementById("gif");
      const correctMusic = document.getElementById("correct-music");
      const wrongMusic = document.getElementById("wrong-music");

      if (selected === q.correctAnswer) {
        score++;
        document.getElementById("score").textContent = `Score: ${score}`;
        gif.src = correctGif;
        correctMusic.play();
      } else {
        gif.src = wrongGif;
        wrongMusic.play();
      }

      document.getElementById("explanation").textContent = q.explanation;

      // Disable all buttons
      Array.from(document.getElementsByClassName("answer-option")).forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correctAnswer) {
          btn.style.backgroundColor = "#d4edda";
          btn.style.borderColor = "#28a745";
        } else if (btn.textContent === selected) {
          btn.style.backgroundColor = "#f8d7da";
          btn.style.borderColor = "#dc3545";
        }
      });
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        alert(`Game Over! Your score: ${score} / ${questions.length}`);
      }
    }

    function toggleMusic() {
      const music = document.getElementById("bg-music");
      const toggle = document.getElementById("music-toggle");
      if (toggle.checked) {
        music.play();
      } else {
        music.pause();
        music.currentTime = 0;
      }
    }

    loadQuestion();
  </script>
</body>
</html>
